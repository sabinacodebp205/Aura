<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA | Favorites</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="AURA home">
        <span class="brand-mark">A</span>
        <span>AURA</span>
      </a>
      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="inspiration.html">Inspiration</a>
        <a href="community.html">Community</a>
        <a href="studio.html">AI Studio</a>
      </nav>
      <div class="header-actions">
        <a class="icon-button active" href="favorites.html" aria-label="Favorites">♡</a>
        <a class="icon-button" href="cart.html" aria-label="Shopping cart">⌁</a>
        <a class="profile-chip" href="profile.html">
          <span class="avatar-mini"></span>
          <span>Arda</span>
        </a>
      </div>
    </header>

    <main class="page-shell">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Saved products</p>
          <h1>Your Favorites</h1>
        </div>
        <a class="text-link" href="index.html">Continue shopping</a>
      </div>

      <section class="product-grid">
        <article class="product-card">
          <button class="favorite-button is-saved" type="button" aria-label="Remove favorite">♥</button>
          <a href="product.html">
            <img src="https://images.unsplash.com/photo-1506629905607-d405d7d3b0d2?auto=format&fit=crop&w=800&q=85" alt="Black hoodie" />
            <div class="product-copy">
              <span>Women</span>
              <h3>Studio Oversized Hoodie</h3>
              <p>$124.00</p>
            </div>
          </a>
          <div class="rating">★★★★★ <span>4.8</span></div>
        </article>
        <article class="product-card">
          <button class="favorite-button is-saved" type="button" aria-label="Remove favorite">♥</button>
          <a href="product.html">
            <img src="https://images.unsplash.com/photo-1539008835657-9e8e9680c956?auto=format&fit=crop&w=800&q=85" alt="Black dress" />
            <div class="product-copy">
              <span>Women</span>
              <h3>Monolith Slip Dress</h3>
              <p>$139.00</p>
            </div>
          </a>
          <div class="rating">★★★★☆ <span>4.7</span></div>
        </article>
        <article class="product-card">
          <button class="favorite-button is-saved" type="button" aria-label="Remove favorite">♥</button>
          <a href="product.html">
            <img src="https://images.unsplash.com/photo-1516826957135-700dedea698c?auto=format&fit=crop&w=800&q=85" alt="White utility jacket" />
            <div class="product-copy">
              <span>Women</span>
              <h3>Sculpted Utility Jacket</h3>
              <p>$188.00</p>
            </div>
          </a>
          <div class="rating">★★★★★ <span>4.9</span></div>
        </article>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Mobile navigation">
      <a href="index.html"><span>⌂</span>Home</a>
      <a href="favorites.html" class="active"><span>♡</span>Favorites</a>
      <a href="cart.html"><span>⌁</span>Cart</a>
      <a href="profile.html"><span>◉</span>Profile</a>
    </nav>

    <script src="app.js"></script>
  </body>
</html>
